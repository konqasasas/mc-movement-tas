// Standalone build: Unimined and the Forge toolchain stay out of the main build.
// Same plugin setup as ParkourCalculatorMod's Forge 1.12.2 loader.
pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'WagYourMaven'; url = 'https://maven.wagyourtail.xyz/releases' }
        maven { name = 'ForgeMaven'; url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mctas-recorder'
