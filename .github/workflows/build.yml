# Pull requests run the fast build: compile and every test except those marked @Category(Slow.class).
# The slow tests (long random soundness runs, searches) run on pushes to main, nightly, by hand, and on
# pull requests labelled full-tests, in a job of their own so they never hold up the fast one.
# The oracle module needs the 1.12.2 server jar, which is never committed, so its tasks skip themselves
# here; the vanilla goldens in physics still check the engine against the game's code. EngineBuildTest
# fails when physics or problem sources changed without ./gradlew :problem:writeEngineBuild.
name: build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and fast tests
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/'
          retention-days: 7

  slow-tests:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Slow tests
        run: ./gradlew slowTest --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-reports
          path: '*/build/reports/tests/'
          retention-days: 7
