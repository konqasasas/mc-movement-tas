subprojects {
    apply plugin: 'java'

    group = 'io.github.konqasasas.mctas'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:-options']
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }
}
