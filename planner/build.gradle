plugins {
    id 'application'
}

dependencies {
    implementation project(':physics')
    implementation project(':problem')
}

application {
    mainClass = 'io.github.konqasasas.mctas.planner.cli.PlannerMain'
    applicationName = 'mctas-planner'
    applicationDefaultJvmArgs = ['-Xmx6g']
}

run {
    workingDir = rootProject.projectDir
}
