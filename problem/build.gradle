plugins {
    id 'application'
}

dependencies {
    implementation project(':physics')
    implementation 'com.google.code.gson:gson:2.8.0'
}

application {
    mainClass = 'io.github.konqasasas.mctas.problem.cli.Main'
    applicationName = 'mctas-problem'
}

run {
    workingDir = rootProject.projectDir
}

tasks.register('writeEngineBuild', JavaExec) {
    description = 'Rewrites the engine build id (physics/src/main/resources/.../engine-build.txt) from the sources.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.konqasasas.mctas.physics.EngineBuild'
    args = [rootProject.projectDir.path,
            rootProject.file('physics/src/main/resources/io/github/konqasasas/mctas/physics/engine-build.txt').path]
}

test {
    systemProperty 'mctas.repoRoot', rootProject.projectDir.path
    // EngineBuildTest reads the sources themselves, so a comment-only change must rerun it too.
    inputs.dir rootProject.file('physics/src/main')
    inputs.dir rootProject.file('problem/src/main')
}

tasks.register('bench', JavaExec) {
    description = 'Single-thread engine speed (ticks/s), heap per state and result checksums (-Pproblems=a.json,b.json, -Prounds).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.konqasasas.mctas.problem.cli.Bench'
    workingDir = rootProject.projectDir
    maxHeapSize = '6g'
    args = ["--rounds=${findProperty('rounds') ?: '4'}", findProperty('problems') ?: 'problems/v1-full/s2007-12j.problem.json,problems/place/01-pillar-2.problem.json']
}
