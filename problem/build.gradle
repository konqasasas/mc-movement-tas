plugins {
    id 'application'
}

dependencies {
    implementation project(':physics')
    implementation 'com.google.code.gson:gson:2.8.0'
}

application {
    mainClass = 'io.github.konqasasas.mctas.problem.cli.Main'
    applicationName = 'mctas-problem'
}

run {
    workingDir = rootProject.projectDir
}
